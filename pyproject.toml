[project]
name = "evalpond"
version = "0.1.0"
description = "A small eval harness for LLM document pipelines, with a plain-language report. Demo set: synthetic proof-of-income documents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "jinja2>=3.1", "pyyaml>=6.0", "reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
evalpond = "evalpond.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalpond"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
ignore = ["C408", "E741", "DTZ", "PLW1510", "S603", "S607"]
