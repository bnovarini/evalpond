name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: End to end on the mock model (no API keys)
        run: |
          uv run evalpond gen
          uv run evalpond run --model mock-strong --judge mock-judge --run-id ci-smoke
          uv run evalpond gen --pack prd
          uv run evalpond run --model mock-strong --taskset tasksets/prd_v1 --out runs-prd --run-id ci-prd
